<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ninetails</title>
  <link rel="stylesheet" href="../common/ui.css">
  <style>
    body { width: 300px; padding: 12px; }
    .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .hd h1 { font-size: 16px; flex: 1; }
    label.f { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 3px; }
    select { width: 100%; }
    .btns { display: flex; gap: 8px; margin-top: 12px; }
    .btns button { flex: 1; }
    #status, #action { margin-top: 10px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="hd">
    <img src="../icons/ninetails.svg" alt="" width="24" height="24">
    <h1>Ninetails</h1>
    <label class="switch" title="Pause or resume"><input type="checkbox" id="enabled"><span class="track"></span></label>
  </div>

  <label class="f" for="profile">Profile</label>
  <select id="profile"></select>

  <label class="f" for="win">This Firefox window is</label>
  <select id="win"></select>
  <div id="win-hint" class="small muted" style="margin-top:4px"></div>

  <div style="margin-top:10px">
    <label class="switch small"><input type="checkbox" id="exempt"><span class="track"></span>Leave this tab where it is</label>
  </div>

  <div class="btns">
    <button id="tidy" class="primary">Tidy now</button>
    <button id="settings">Settings</button>
  </div>
  <div id="action"></div>
  <div id="status"></div>

  <script src="../common/rules.js"></script>
  <script src="popup.js"></script>
</body>
</html>
